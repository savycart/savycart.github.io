<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Private Space</title>
    <style>
        :root {
            --bg-color: #030712;
            --panel-bg: rgba(15, 23, 42, 0.75);
            --accent-glow: #06b6d4;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #f43f5e;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Neural Network Canvas Background */
        #neuralCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
        }

        /* Container Layouts */
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
            padding: 20px;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }

        /* Intro & Password Screen */
        .auth-card {
            background: var(--panel-bg);
            border: 1px solid rgba(6, 182, 212, 0.3);
            backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 0 50px rgba(6, 182, 212, 0.15);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        .typing-title {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--accent-blue);
            margin-bottom: 25px;
            min-height: 40px;
            border-right: 2px solid var(--accent-glow);
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            animation: typing 2.5s steps(20, end) forwards, blink 0.75s infinite;
        }

        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { from, to { border-color: transparent } 50% { border-color: var(--accent-glow); } }

        .auth-input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .auth-input:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-glow), var(--accent-blue));
            color: #030712;
            font-weight: 700;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            font-size: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
        }

        .error-msg {
            color: var(--danger);
            margin-top: 15px;
            font-size: 0.9rem;
            height: 20px;
        }

        /* Homepage Dashboard Layout */
        #homeScreen {
            justify-content: flex-start;
            align-items: flex-start;
            padding: 40px;
            overflow-y: auto;
        }

        .dashboard-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .dashboard-title h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dashboard-title p {
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Grid Cards Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            width: 100%;
            padding-bottom: 100px;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 24px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            border-color: var(--accent-glow);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(6, 182, 212, 0.15);
        }

        .card h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Floating Plus Action Button */
        .fab-container {
            position: fixed;
            bottom: 40px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
        }

        .fab-label {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(6, 182, 212, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .fab {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-glow), var(--accent-blue));
            border: none;
            color: #030712;
            font-size: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.5);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .fab:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 0 45px rgba(6, 182, 212, 0.8);
        }

        /* Modal Popup Dialog */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--panel-bg);
            border: 1px solid rgba(6, 182, 212, 0.4);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .modal h3 {
            margin-bottom: 15px;
            color: var(--accent-blue);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <!-- Neural Network Animated Background -->
    <canvas id="neuralCanvas"></canvas>

    <!-- PASSWORD SCREEN -->
    <div id="authScreen" class="screen">
        <div class="auth-card">
            <div class="typing-title">WELCOME</div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <input type="password" id="passwordInput" class="auth-input" placeholder="Enter Master Password" autocomplete="current-password" autofocus required>
                <button type="submit" class="btn">UNLOCK SPACE</button>
            </form>
            <div id="errorMsg" class="error-msg"></div>
        </div>
    </div>

    <!-- HOMEPAGE DASHBOARD SCREEN -->
    <div id="homeScreen" class="screen hidden">
        <div class="dashboard-header">
            <div class="dashboard-title">
                <h1>MY PRIVATE SPACE</h1>
                <p>Welcome back, Master</p>
            </div>
            <button class="btn" style="width: auto; padding: 8px 16px; font-size: 0.85rem;" onclick="lockScreen()">Lock Session</button>
        </div>

        <!-- Dynamic Folder Grid Cards -->
        <div id="folderGrid" class="grid-container">
            <!-- Items injected dynamically -->
        </div>

        <!-- Floating Action Plus Button -->
        <div class="fab-container">
            <div class="fab-label">PLUS</div>
            <button class="fab" onclick="openModal()">+</button>
        </div>
    </div>

    <!-- NEW FOLDER POPUP MODAL -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal">
            <h3>Create New Folder</h3>
            <input type="text" id="folderNameInput" class="auth-input" placeholder="Folder Name (e.g. Ideas, Secrets)" style="margin-bottom: 0;">
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn" onclick="createFolder()">Create</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. NEURAL NETWORK ANIMATION ---
        const canvas = document.getElementById('neuralCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.radius = Math.random() * 2 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(6, 182, 212, 0.7)';
                ctx.fill();
            }
        }

        for (let i = 0; i < 65; i++) particles.push(new Particle());

        function animateNeuralNet() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 130) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(6, 182, 212, ${1 - dist / 130})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateNeuralNet);
        }
        animateNeuralNet();

        // --- 2. AUTHENTICATION LOGIC ---
        const MASTER_PASSWORD = "abdulhamjad";

        function handleLogin(e) {
            e.preventDefault();
            const inputVal = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMsg');

            if (inputVal === MASTER_PASSWORD) {
                errorMsg.textContent = "";
                document.getElementById('authScreen').classList.add('hidden');
                setTimeout(() => {
                    document.getElementById('homeScreen').classList.remove('hidden');
                    loadFolders();
                }, 400);
            } else {
                errorMsg.textContent = "ACCESS DENIED";
                document.getElementById('passwordInput').value = "";
                // Quick error shake effect
                const card = document.querySelector('.auth-card');
                card.style.transform = 'translateX(10px)';
                setTimeout(() => card.style.transform = 'translateX(-10px)', 100);
                setTimeout(() => card.style.transform = 'translateX(0)', 200);
            }
        }

        function lockScreen() {
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('passwordInput').value = "";
            setTimeout(() => {
                document.getElementById('authScreen').classList.remove('hidden');
            }, 400);
        }

        // --- 3. DYNAMIC FOLDER / ITEM MANAGEMENT ---
        function getStoredFolders() {
            return JSON.parse(localStorage.getItem('master_folders')) || [
                { name: "Journal", desc: "Private logs and thoughts" },
                { name: "Secrets", desc: "Secure links & credentials" }
            ];
        }

        function loadFolders() {
            const grid = document.getElementById('folderGrid');
            const folders = getStoredFolders();
            
            grid.innerHTML = folders.map(f => `
                <div class="card">
                    <h3>📁 ${f.name}</h3>
                    <p>${f.desc || 'Custom folder category'}</p>
                </div>
            `).join('');
        }

        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('folderNameInput').focus();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.getElementById('folderNameInput').value = "";
        }

        function createFolder() {
            const name = document.getElementById('folderNameInput').value.trim();
            if (!name) return;

            const folders = getStoredFolders();
            folders.push({ name: name, desc: "Added via master control" });
            localStorage.setItem('master_folders', JSON.stringify(folders));

            loadFolders();
            closeModal();
        }
    </script>
</body>
</html>
