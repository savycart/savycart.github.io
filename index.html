<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Private Space</title>
    <style>
        :root {
            --bg-color: #030712;
            --panel-bg: rgba(15, 23, 42, 0.75);
            --accent-glow: #06b6d4;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #f43f5e;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #neuralCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
        }

        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease, transform 0.6s ease;
            padding: 20px;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }

        /* Auth Screen */
        .auth-card {
            background: var(--panel-bg);
            border: 1px solid rgba(6, 182, 212, 0.3);
            backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 0 50px rgba(6, 182, 212, 0.15);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        .typing-title {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 3px;
            color: var(--accent-blue);
            margin-bottom: 25px;
            min-height: 40px;
            border-right: 2px solid var(--accent-glow);
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            animation: typing 2s steps(20, end) forwards, blink 0.75s infinite;
        }

        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink { from, to { border-color: transparent } 50% { border-color: var(--accent-glow); } }

        .auth-input, .auth-select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .auth-input:focus, .auth-select:focus {
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }

        .auth-select option {
            background: #030712;
            color: white;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-glow), var(--accent-blue));
            color: #030712;
            font-weight: 700;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            font-size: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
        }

        .error-msg {
            color: var(--danger);
            margin-top: 15px;
            font-size: 0.9rem;
            height: 20px;
        }

        /* Dashboard & Folder Screens */
        #homeScreen, #folderViewScreen {
            justify-content: flex-start;
            align-items: flex-start;
            padding: 40px;
            overflow-y: auto;
        }

        .dashboard-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .dashboard-title h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .dashboard-title p {
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .nav-back-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            width: auto;
            padding: 8px 16px;
            font-size: 0.85rem;
            border-radius: 10px;
        }

        /* Selection Action Toolbar */
        .selection-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--danger);
            padding: 12px 24px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(244, 63, 94, 0.3);
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .selection-bar.active {
            transform: translateX(-50%) translateY(0);
        }

        .delete-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Grid Cards Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            width: 100%;
            padding-bottom: 100px;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 24px;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .card:hover {
            border-color: rgba(6, 182, 212, 0.5);
            transform: translateY(-3px);
        }

        .card.active-glow {
            border-color: var(--accent-glow);
            box-shadow: 0 0 25px var(--accent-glow);
            background: rgba(6, 182, 212, 0.1);
        }

        .card.selected {
            border-color: var(--danger) !important;
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.4) !important;
            background: rgba(244, 63, 94, 0.1) !important;
        }

        .card h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            word-break: break-all;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-thumb {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
            background: #000;
        }

        /* Floating Plus Action Button */
        .fab-container {
            position: fixed;
            bottom: 40px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
        }

        .fab-label {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(6, 182, 212, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            backdrop-filter: blur(8px);
        }

        .fab {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-glow), var(--accent-blue));
            border: none;
            color: #030712;
            font-size: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.5);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .fab:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 0 45px rgba(6, 182, 212, 0.8);
        }

        /* Modal Dialog */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--panel-bg);
            border: 1px solid rgba(6, 182, 212, 0.4);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .modal h3 {
            margin-bottom: 15px;
            color: var(--accent-blue);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }

        /* Media Viewer Overlay */
        #mediaViewer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }
        #mediaViewer.active {
            opacity: 1;
            pointer-events: auto;
        }
        #mediaViewer img, #mediaViewer video {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(6, 182, 212, 0.3);
        }
    </style>
</head>
<body>

    <canvas id="neuralCanvas"></canvas>

    <!-- SELECTION DELETION TOOLBAR -->
    <div id="selectionBar" class="selection-bar">
        <span id="selectedCount">0 selected</span>
        <button class="delete-btn" onclick="deleteSelectedItems()">Delete Selected</button>
        <button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;" onclick="clearSelection()">Cancel</button>
    </div>

    <!-- MEDIA VIEWER MODAL -->
    <div id="mediaViewer" onclick="closeMediaViewer()">
        <div id="mediaContainer" style="position: relative;" onclick="event.stopPropagation()"></div>
    </div>

    <!-- PASSWORD SCREEN -->
    <div id="authScreen" class="screen">
        <div class="auth-card">
            <div class="typing-title">WELCOME</div>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <input type="password" id="passwordInput" class="auth-input" placeholder="Enter Master Password" autocomplete="current-password" autofocus required>
                <button type="submit" class="btn">UNLOCK SPACE</button>
            </form>
            <div id="errorMsg" class="error-msg"></div>
        </div>
    </div>

    <!-- HOMEPAGE DASHBOARD SCREEN -->
    <div id="homeScreen" class="screen hidden">
        <div class="dashboard-header">
            <div class="dashboard-title">
                <h1>MY PRIVATE SPACE</h1>
                <p>Welcome back, Master</p>
            </div>
            <button class="btn nav-back-btn" onclick="lockScreen()">Lock Session</button>
        </div>
        <div id="folderGrid" class="grid-container"></div>
        <div class="fab-container">
            <div class="fab-label">NEW FOLDER</div>
            <button class="fab" onclick="openFolderModal()">+</button>
        </div>
    </div>

    <!-- FOLDER CONTENTS SCREEN -->
    <div id="folderViewScreen" class="screen hidden">
        <div class="dashboard-header">
            <div class="dashboard-title">
                <h1 id="currentFolderTitle">FOLDER</h1>
                <p>Stored Links, Photos & Videos</p>
            </div>
            <button class="btn nav-back-btn" onclick="backToDashboard()">← Back Home</button>
        </div>
        <div id="itemGrid" class="grid-container"></div>
        <div class="fab-container">
            <div class="fab-label">ADD ITEM</div>
            <button class="fab" onclick="openItemModal()">+</button>
        </div>
    </div>

    <!-- NEW FOLDER MODAL -->
    <div id="folderModal" class="modal-overlay">
        <div class="modal">
            <h3>Create New Folder</h3>
            <input type="text" id="newFolderName" class="auth-input" placeholder="Folder Name (e.g. Gallery, Docs)" style="margin-bottom: 0;">
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModals()">Cancel</button>
                <button class="btn" onclick="createFolder()">Create</button>
            </div>
        </div>
    </div>

    <!-- ADD ITEM MODAL (Link, Photo, Video) -->
    <div id="itemModal" class="modal-overlay">
        <div class="modal">
            <h3>Add New Item</h3>
            <select id="itemTypeSelect" class="auth-select" onchange="switchItemInputs()">
                <option value="link">🔗 Web Link</option>
                <option value="photo">📷 Photo</option>
                <option value="video">🎥 Video</option>
            </select>
            
            <input type="text" id="itemTitle" class="auth-input" placeholder="Item Name / Title" style="margin-bottom: 12px;">
            
            <!-- Dynamic field for Link URL or File upload -->
            <div id="urlFieldContainer">
                <input type="text" id="itemUrl" class="auth-input" placeholder="URL (e.g. https://google.com)" style="margin-bottom: 0;">
            </div>
            <div id="fileFieldContainer" style="display: none;">
                <input type="file" id="itemFile" class="auth-input" style="margin-bottom: 0; padding: 10px;" accept="image/*,video/*">
            </div>

            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModals()">Cancel</button>
                <button class="btn" onclick="createItem()">Save Item</button>
            </div>
        </div>
    </div>

    <script>
        // --- BACKGROUND ANIMATION ---
        const canvas = document.getElementById('neuralCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.radius = Math.random() * 2 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(6, 182, 212, 0.7)';
                ctx.fill();
            }
        }

        for (let i = 0; i < 65; i++) particles.push(new Particle());

        function animateNeuralNet() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 130) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(6, 182, 212, ${1 - dist / 130})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateNeuralNet);
        }
        animateNeuralNet();

        // --- APP STATE & LOGIC ---
        const MASTER_PASSWORD = "abdulhamjad";
        let currentView = "home"; // "home" or "folder"
        let activeFolder = null;
        let selectedIndices = new Set();
                function handleLogin(e) {
            e.preventDefault();
            const val = document.getElementById('passwordInput').value;
            const err = document.getElementById('errorMsg');

            if (val === MASTER_PASSWORD) {
                err.textContent = "";
                document.getElementById('authScreen').classList.add('hidden');
                setTimeout(() => {
                    document.getElementById('homeScreen').classList.remove('hidden');
                    currentView = "home";
                    loadFolders();
                }, 400);
            } else {
                err.textContent = "ACCESS DENIED";
                document.getElementById('passwordInput').value = "";
            }
        }

        function lockScreen() {
            clearSelection();
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('passwordInput').value = "";
            setTimeout(() => {
                document.getElementById('authScreen').classList.remove('hidden');
            }, 400);
        }

        // --- LOCAL STORAGE DATABASE ---
        function getDatabase() {
            return JSON.parse(localStorage.getItem('master_db_media')) || {
                folders: [
                    { name: "Journal", items: [{ type: "link", title: "My Diary", content: "#" }] }
                ]
            };
        }

        function saveDatabase(db) {
            localStorage.setItem('master_db_media', JSON.stringify(db));
        }

        // --- INTERACTIONS (Tap, Double Tap, Long Press) ---
        function setupCardInteractions(cardElement, index, clickAction, doubleClickAction) {
            let tapTimeout = null;
            let longPressTimer = null;
            let isLongPress = false;

            cardElement.addEventListener('pointerdown', (e) => {
                isLongPress = false;
                longPressTimer = setTimeout(() => {
                    isLongPress = true;
                    toggleSelection(index, cardElement);
                }, 600);
            });

            cardElement.addEventListener('pointerup', (e) => {
                clearTimeout(longPressTimer);
                if (isLongPress) return;

                if (selectedIndices.size > 0) {
                    toggleSelection(index, cardElement);
                    return;
                }

                if (!tapTimeout) {
                    tapTimeout = setTimeout(() => {
                        tapTimeout = null;
                        document.querySelectorAll('.card').forEach(c => c.classList.remove('active-glow'));
                        cardElement.classList.add('active-glow');
                        if(clickAction) clickAction();
                    }, 250);
                } else {
                    clearTimeout(tapTimeout);
                    tapTimeout = null;
                    if(doubleClickAction) doubleClickAction();
                }
            });

            cardElement.addEventListener('pointercancel', () => clearTimeout(longPressTimer));
        }

        function toggleSelection(index, cardElement) {
            if (selectedIndices.has(index)) {
                selectedIndices.delete(index);
                cardElement.classList.remove('selected');
            } else {
                selectedIndices.add(index);
                cardElement.classList.add('selected');
            }

            const bar = document.getElementById('selectionBar');
            if (selectedIndices.size > 0) {
                bar.classList.add('active');
                document.getElementById('selectedCount').textContent = `${selectedIndices.size} selected`;
            } else {
                bar.classList.remove('active');
            }
        }

        function clearSelection() {
            selectedIndices.clear();
            document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
            document.getElementById('selectionBar').classList.remove('active');
        }

        // --- LOAD FOLDERS (HOME) ---
        function loadFolders() {
            currentView = "home";
            clearSelection();
            const grid = document.getElementById('folderGrid');
            const db = getDatabase();
            
            grid.innerHTML = "";
            db.folders.forEach((folder, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div style="font-size: 32px; margin-bottom: 12px;">📁</div>
                    <h3>${folder.name}</h3>
                    <p>${folder.items.length} saved item(s)</p>
                `;

                setupCardInteractions(card, index, 
                    () => {}, 
                    () => openFolder(folder.name)
                );

                grid.appendChild(card);
            });
        }

        function openFolder(folderName) {
            currentView = "folder";
            activeFolder = folderName;
            clearSelection();
            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('folderViewScreen').classList.remove('hidden');
            document.getElementById('currentFolderTitle').textContent = folderName.toUpperCase();
            loadItems();
        }

        function backToDashboard() {
            clearSelection();
            document.getElementById('folderViewScreen').classList.add('hidden');
            document.getElementById('homeScreen').classList.remove('hidden');
            loadFolders();
        }

        // --- LOAD ITEMS (LINKS, PHOTOS, VIDEOS) ---
        function loadItems() {
            clearSelection();
            const grid = document.getElementById('itemGrid');
            const db = getDatabase();
            const folder = db.folders.find(f => f.name === activeFolder);
            
            grid.innerHTML = "";
            if (!folder) return;

            folder.items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';

                if (item.type === 'photo') {
                    card.innerHTML = `
                        <img src="${item.content}" class="card-thumb">
                        <h3>📷 ${item.title}</h3>
                        <p>Photo File</p>
                    `;
                } else if (item.type === 'video') {
                    card.innerHTML = `
                        <video src="${item.content}" class="card-thumb" muted></video>
                        <h3>🎥 ${item.title}</h3>
                        <p>Video File</p>
                    `;
                } else {
                    card.innerHTML = `
                        <div style="font-size: 32px; margin-bottom: 12px;">🔗</div>
                        <h3>${item.title}</h3>
                        <p>${item.content}</p>
                    `;
                }

                setupCardInteractions(card, index,
                    () => {}, 
                    () => {
                        if (item.type === 'link') {
                            if (item.content && item.content !== '#') window.open(item.content, '_blank');
                        } else if (item.type === 'photo') {
                            showMediaViewer(`<img src="${item.content}">`);
                        } else if (item.type === 'video') {
                            showMediaViewer(`<video src="${item.content}" controls autoplay></video>`);
                        }
                    }
                );

                grid.appendChild(card);
            });
        }

        // --- MEDIA VIEWER ---
        function showMediaViewer(htmlContent) {
            const viewer = document.getElementById('mediaViewer');
            const container = document.getElementById('mediaContainer');
            container.innerHTML = htmlContent;
            viewer.classList.add('active');
        }

        function closeMediaViewer() {
            const viewer = document.getElementById('mediaViewer');
            viewer.classList.remove('active');
            document.getElementById('mediaContainer').innerHTML = "";
        }

        // --- DELETION LOGIC ---
        function deleteSelectedItems() {
            const db = getDatabase();
            
            if (currentView === "home") {
                db.folders = db.folders.filter((_, idx) => !selectedIndices.has(idx));
            } else if (currentView === "folder") {
                const folder = db.folders.find(f => f.name === activeFolder);
                if (folder) {
                    folder.items = folder.items.filter((_, idx) => !selectedIndices.has(idx));
                }
            }

            saveDatabase(db);
            clearSelection();

            if (currentView === "home") loadFolders();
            else loadItems();
        }

        // --- MODAL CONTROLS ---
        function openFolderModal() {
            document.getElementById('folderModal').classList.add('active');
            document.getElementById('newFolderName').focus();
        }

        function openItemModal() {
            document.getElementById('itemModal').classList.add('active');
            document.getElementById('itemTitle').focus();
        }

        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
            document.getElementById('newFolderName').value = "";
            document.getElementById('itemTitle').value = "";
            document.getElementById('itemUrl').value = "";
            document.getElementById('itemFile').value = "";
            document.getElementById('itemTypeSelect').value = "link";
            switchItemInputs();
        }

        function switchItemInputs() {
            const type = document.getElementById('itemTypeSelect').value;
            const urlContainer = document.getElementById('urlFieldContainer');
            const fileContainer = document.getElementById('fileFieldContainer');

            if (type === 'link') {
                urlContainer.style.display = 'block';
                fileContainer.style.display = 'none';
            } else {
                urlContainer.style.display = 'none';
                fileContainer.style.display = 'block';
            }
        }

        function createFolder() {
            const name = document.getElementById('newFolderName').value.trim();
            if (!name) return;

            const db = getDatabase();
            db.folders.push({ name: name, items: [] });
            saveDatabase(db);
            closeModals();
            loadFolders();
        }

        function createItem() {
            const type = document.getElementById('itemTypeSelect').value;
            const title = document.getElementById('itemTitle').value.trim();
            if (!title) return;

            const db = getDatabase();
            const folder = db.folders.find(f => f.name === activeFolder);
            if (!folder) return;

            if (type === 'link') {
                let url = document.getElementById('itemUrl').value.trim();
                if (url && !url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }
                folder.items.push({ type: 'link', title: title, content: url || '#' });
                saveDatabase(db);
                closeModals();
                loadItems();
            } else {
                const fileInput = document.getElementById('itemFile');
                if (fileInput.files && fileInput.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        folder.items.push({ type: type, title: title, content: e.target.result });
                        saveDatabase(db);
                        closeModals();
                        loadItems();
                    };
                    reader.readAsDataURL(fileInput.files[0]);
                }
            }
        }
    </script>
</body>
</html>
