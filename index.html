<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savy Cart</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-JCCN0D4FF4"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-JCCN0D4FF4');
</script>

<style>
body {
  font-family: 'Poppins', sans-serif;
  margin: 0;
  background: radial-gradient(circle at center, #102a4f 0%, #061226 100%);
  background-attachment: fixed;
  color: white;
}

/* HEADER */
.header {
  text-align: center;
  padding: 40px 15px 10px;
}

/* LOGO */
.logo {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #D4AF37;
  box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
  filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.6));
}

@keyframes goldPulse {
  0% {
    background: linear-gradient(to bottom, #f9e195 0%, #d4af37 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 2px rgba(212, 175, 55, 0.4));
  }
  50% {
    background: linear-gradient(to bottom, #ffffff 0%, #f9e195 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.6));
  }
  100% {
    background: linear-gradient(to bottom, #f9e195 0%, #d4af37 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 2px rgba(212, 175, 55, 0.4));
  }
}

.title {
  font-family: 'Playfair Display', serif;
  font-size: 36px;
  font-weight: bold;
  margin-top: 15px;
  letter-spacing: 1px;
  display: inline-block;
  animation: goldPulse 3s infinite ease-in-out;
}

/* SEARCH */
.search {
  display: flex;
  justify-content: center;
  margin: 30px 10px;
}

.search-box {
  width: 85%;
  max-width: 420px;
  display: flex;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(212, 175, 55, 0.4);
  border-radius: 30px;
  overflow: hidden;
  backdrop-filter: blur(10px);
}

.search-box input {
  flex: 1;
  border: none;
  padding: 14px;
  outline: none;
  font-size: 15px;
  background: transparent;
  color: white;
}

.search-box span {
  padding: 14px 20px;
  cursor: pointer;
  background: #D4AF37;
  color: #061226;
  font-weight: bold;
}

/* PRODUCTS GRID */
.products {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  padding: 20px;
  max-width: 1200px;
  margin: 0 auto;
}

/* CARD */
.card {
  background: rgba(255, 255, 255, 0.08);
  padding: 15px;
  text-align: center;
  border-radius: 18px;
  transition: 0.3s;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.card:hover {
  transform: translateY(-5px);
  background: rgba(255, 255, 255, 0.12);
  border-color: #D4AF37;
}

/* IMAGE */
.card img {
  width: 100%;
  max-width: 250px;
  height: 150px;
  object-fit: cover;
  border-radius: 12px;
  display: block;
  margin: 0 auto;
}

.card a {
  text-decoration: none;
  color: inherit;
}

.card h4 {
  margin: 12px 0 0;
  font-size: 14px;
  color: #f1f1f1;
  font-weight: 400;
}

/* MOBILE */
@media (max-width: 600px) {
  .products {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 10px;
  }
  .title { font-size: 28px; }
  .card img { height: 120px; }
}
</style>
</head>

<body>

<div class="header">
  <img src="logo.png" class="logo">
  <br>
  <div class="title">SAVY CART</div>
</div>

<div class="search">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search premium products..." onkeyup="searchProducts()">
    <span>🔍</span>
  </div>
</div>

<div class="products">

  <div class="card">
    <a href="https://www.youtube.com/@SAVYCART232" target="_blank">
      <img src="logo.png">
      <h4>YouTube Channel</h4>
    </a>
  </div>

  <div class="card">
    <a href="#">
      <img src="https://via.placeholder.com/150/102a4f/ffffff?text=Product+1">
      <h4>Premium Watch</h4>
    </a>
  </div>

  <div class="card">
    <a href="#">
      <img src="https://via.placeholder.com/150/102a4f/ffffff?text=Product+2">
      <h4>Smart Gadget</h4>
    </a>
  </div>

  <div class="card">
    <a href="#">
      <img src="https://via.placeholder.com/150/102a4f/ffffff?text=Product+3">
      <h4>Luxury Decor</h4>
    </a>
  </div>

</div>

<script>
function searchProducts() {
  let input = document.getElementById("searchInput").value.toLowerCase();
  let cards = document.getElementsByClassName("card");

  for (let i = 0; i < cards.length; i++) {
    let text = cards[i].innerText.toLowerCase();
    cards[i].style.display = text.includes(input) ? "block" : "none";
  }
}
</script>

</body>
</html>
