<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savy Cart</title>

<style>
body {font-family: Arial; margin:0; background:#f5f5f5;}

/* LOGO */
.header {
  text-align:center;
  padding:20px;
}

.logo {
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid gold;
}

/* SEARCH */
.search {
  display:flex;
  justify-content:center;
  margin:10px;
}

.search input {
  width:60%;
  padding:10px;
}

.search button {
  padding:10px;
}

/* PRODUCTS */
.products {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}

.card {
  background:white;
  padding:10px;
  text-align:center;
  border-radius:10px;
}

.card img {
  width:100%;
}
</style>
</head>

<body>

<!-- LOGO (NO LINK NOW) -->
<div class="header">
  <img src="logo.png" class="logo">
</div>

<!-- SEARCH -->
<div class="search">
  <input id="searchInput" placeholder="Search..." onkeyup="searchProducts()">
</div>

<!-- PRODUCTS -->
<div class="products" id="productList">

  <div class="card">
    <a href="YOUR-LINK-HERE" target="_blank">
      <img src="https://via.placeholder.com/150">
      <h4 class="title">Item One</h4>
    </a>
  </div>

  <div class="card">
    <a href="YOUR-LINK-HERE" target="_blank">
      <img src="https://via.placeholder.com/150">
      <h4 class="title">Item Two</h4>
    </a>
  </div>

</div>

<script>
function searchProducts() {
  let input = document.getElementById("searchInput").value.toLowerCase();
  let cards = document.getElementsByClassName("card");

  for (let i = 0; i < cards.length; i++) {
    let title = cards[i].innerText.toLowerCase();

    if (title.includes(input)) {
      cards[i].style.display = "block";
    } else {
      cards[i].style.display = "none";
    }
  }
}
</script>

</body>
</html>
